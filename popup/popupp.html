<!DOCTYPE html>
<html lang="en" style="width: 380px; height: 550px; overflow: hidden;">
<head>
  <meta charset="UTF-8">
  <title>Victory - Safe Browsing & Accountability</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 380px;
      min-width: 380px;
      height: 550px;
      min-height: 550px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    
    /* Main container */
    .popup {
      width: 380px;
      height: 550px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
    }
    
    /* User */
    .user-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 24px;
      font-weight: 600;
      color: white;
    }
    
    .user-name {
      font-size: 18px;
      font-weight: 600;
      text-align: center;
    }
    
    .user-email {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
    
    /* Status */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      padding: 10px 16px;
      width: 100%;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    
    /* Pairing */
    .pairing-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #64748b;
      text-align: center;
      margin-bottom: 12px;
    }
    
    .pairing-code {
      font-family: 'Courier New', monospace;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 16px;
      padding: 16px 24px;
      text-align: center;
    }
    
    /* Verse */
    .verse {
      text-align: center;
      padding: 0 12px;
      max-width: 320px;
    }
    
    .verse-text {
      font-size: 14px;
      line-height: 1.6;
      color: #cbd5e1;
      font-style: italic;
    }
    
    .verse-text::before {
      content: '"';
      color: #3b82f6;
      font-size: 20px;
    }
    
    .verse-text::after {
      content: '"';
      color: #3b82f6;
      font-size: 20px;
    }
    
    .verse-ref {
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
    }
    
    /* Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    
    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }
    
    .btn-secondary {
      background: transparent;
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    
    /* Footer */
    .footer {
      font-size: 11px;
      color: #475569;
      text-align: center;
    }
    
    .footer-brand {
      color: #3b82f6;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="popup">
    
    
    <!-- Status -->
    <div class="status">
      <div class="status-dot"></div>
      <span>Connected to Victory</span>
    </div>
    
   
    
    <!-- Verse -->
    <div class="verse">
      <p class="verse-text">I can do all things through Christ who strengthens me.</p>
      <div class="verse-ref">Philippians 4:13</div>
    </div>
    
    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-secondary" id="sign-OutBtn">Sign Out</button>
    </div>
    
    <!-- Footer -->
    <div class="footer">
      <span class="footer-brand">Victory - safe browsing & accountability</span> — Faith & Productivity
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const signOutBtn = document.getElementById('sign-OutBtn');
      
      signOutBtn.addEventListener('click', async () => {
        try {
          const response = await chrome.runtime.sendMessage({ type: 'LOGOUT' });
          if (response.ok) {
            window.close();
          } else {
            console.error('Logout failed:', response.error);
            alert('Logout failed. Please try again.');
          }
        } catch (error) {
          console.error('Logout error:', error);
          alert('Logout failed. Please try again.');
        }
      });
    });
  </script>

</body>
</html>
